# BitBoot systemd-boot configuration
# This file configures the boot loader menu behavior

# Default boot entry (without .conf extension)
default bitboot

# Timeout in seconds (0 = no timeout, menu hidden)
# Use space bar to show menu when timeout is 0
timeout 5

# Enable console output mode (auto, max, keep)
console-mode auto

# Enable editor for kernel command line (disable for security)
editor yes

# Auto-enroll secure boot keys from /loader/keys/
auto-entries yes
auto-firmware yes

# Beep on boot entry selection
#beep yes
