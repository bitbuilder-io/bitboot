# BitBoot - Default Boot Entry
# Boots the BitBoot recovery shell with full network and ZFS support
#
# This entry provides a minimal rescue environment with:
# - Network stack (networkd, resolved) for HTTP/HTTPS
# - Compression support (xz, zstd, gzip)
# - Loop device support for attaching images
# - ZFS kernel modules and userspace tools
# - Minimal shell for recovery/debugging
#
# This is the main BitBoot UKI with recovery shell capabilities embedded.

title     BitBoot Recovery Shell
efi       /EFI/bitboot/bitboot.efi
