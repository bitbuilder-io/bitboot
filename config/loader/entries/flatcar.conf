# Flatcar Container Linux - Network Pull Boot Profile
# Uses rd.systemd.pull to download and boot raw disk image
#
# Flatcar Container Linux is similar to Fedora CoreOS and provides
# production-ready container-optimized raw disk images.
#
# This profile uses a dedicated UKI with embedded kernel cmdline for
# Flatcar Container Linux network pull booting.

title     Flatcar Container Linux (Network Pull)
efi       /EFI/bitboot/flatcar.efi
