# ZFSBootMenu - ZFS Boot Environment Manager
# Chainloads ZFSBootMenu EFI for ZFS pool discovery and BE management
#
# ZFSBootMenu provides:
# - Pre-compiled ZFS modules matching the embedded kernel
# - Full ZFS userspace tools (zpool, zfs, zdb, zstream, zinject)
# - Recovery shell with networking, SSH, and essential utilities
# - Boot environment management (snapshot, clone, rollback, chroot)
# - Key management for native ZFS encryption
#
# Documentation: https://docs.zfsbootmenu.org/

title     ZFSBootMenu Recovery
efi       /EFI/zbm/zfsbootmenu.efi
