# Alpine Linux ZFS Installer - Network Boot Profile
# Boots Alpine Linux Extended with ZFS support for Root-on-ZFS installations
#
# This profile is designed for following the OpenZFS Root on ZFS guide:
# https://openzfs.github.io/openzfs-docs/Getting%20Started/Arch%20Linux/Root%20on%20ZFS.html
#
# Features:
# - Pre-loaded ZFS kernel modules matching the LTS kernel
# - Writable tmpfs overlay for installing packages
# - Full networking support (DHCP, DNS)
# - Partition tools (parted, gdisk, cryptsetup)
#
# This profile uses a dedicated UKI with Alpine kernel and initramfs
# embedded along with the ZFS-specific boot parameters.

title     Alpine Linux ZFS Installer
efi       /EFI/bitboot/alpine-zfs-installer.efi
