# uCore (ublue-os) - Network Pull Boot Profile
# Uses rd.systemd.pull to download and boot Fedora CoreOS raw disk image
#
# uCore is an OCI-based OS built on Fedora CoreOS with added features:
# - ZFS support pre-installed
# - Cockpit for web-based management
# - Docker/Podman container runtimes
# - Tailscale and WireGuard tools
#
# This profile boots Fedora CoreOS which can then be rebased to uCore.
# After boot, run: sudo rpm-ostree rebase ostree-unverified-registry:ghcr.io/ublue-os/ucore:stable
#
# For more info: https://github.com/ublue-os/ucore

title     uCore / Fedora CoreOS (Network Pull)
efi       /EFI/bitboot/ucore.efi
