# netboot.xyz - Network Boot Utility
# Chainloads netboot.xyz EFI for iPXE-based network booting
#
# netboot.xyz provides access to dozens of operating system installers
# and utilities over the network without pre-downloading ISOs.
#
# Supported distributions include:
# - Arch Linux, Ubuntu, Debian, Fedora, CentOS
# - Alpine Linux, NixOS, Gentoo
# - Windows PE, VMware ESXi
# - Various rescue and utility images
#
# Documentation: https://netboot.xyz/

title     netboot.xyz
efi       /EFI/netboot/netboot.xyz.efi
