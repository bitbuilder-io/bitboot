# Fedora CoreOS - Network Pull Boot Profile
# Uses rd.systemd.pull to download and boot raw disk image
#
# Fedora CoreOS provides DDI-compliant raw disk images that support
# GPT auto-discovery for automatic root partition detection.
#
# This profile uses a dedicated UKI with embedded kernel cmdline for
# Fedora CoreOS network pull booting.

title     Fedora CoreOS (Network Pull)
efi       /EFI/bitboot/fedora-coreos.efi
