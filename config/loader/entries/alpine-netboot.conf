# Alpine Linux - Network Boot Profile
# Lightweight netboot using kernel + initrd + modloop
#
# Alpine Linux runs entirely from RAM making it extremely fast
# and suitable for diskless systems or rescue operations.
#
# This profile uses a dedicated UKI with Alpine kernel and initramfs
# embedded for network boot.

title     Alpine Linux (Netboot)
efi       /EFI/bitboot/alpine-netboot.efi
