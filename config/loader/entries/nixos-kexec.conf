# NixOS - Kexec Installer Boot Profile
# Boots NixOS via kexec-based installer from nix-community/nixos-images
#
# NixOS has a unique boot model that requires kexec for network installation.
# The installer image is extracted to RAM and then kexec'd into.
#
# Note: Requires ~1GB+ RAM for initrd extraction
#
# Alternative: Use netboot.xyz to chainload NixOS iPXE script
#
# This profile uses a dedicated UKI with NixOS kernel and initrd
# embedded for kexec-based installation.

title     NixOS Kexec Installer
efi       /EFI/bitboot/nixos-kexec.efi
