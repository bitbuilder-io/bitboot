# VyOS 1.5 (Circinus) - Network Boot Profile
# Boots VyOS router OS using squashfs fetch over HTTP
#
# VyOS requires extracting vmlinuz, initrd.img, and filesystem.squashfs
# from the ISO and serving them over HTTP.
#
# Source: https://github.com/vyos/vyos-rolling-nightly-builds/releases/
#
# This profile uses a dedicated UKI with VyOS kernel and initrd
# embedded for network boot with squashfs fetch.

title     VyOS 1.5 Rolling (Network Boot)
efi       /EFI/bitboot/vyos.efi
