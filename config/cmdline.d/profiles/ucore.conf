# uCore (ublue-os) network pull cmdline
# Embedded in ucore.efi UKI
#
# uCore is an OCI image of Fedora CoreOS with "batteries included".
# This profile boots a base Fedora CoreOS image that can be rebased to uCore.
#
# After booting, rebase to uCore with:
#   sudo rpm-ostree rebase ostree-unverified-registry:ghcr.io/ublue-os/ucore:stable
#
# NOTE: The Fedora CoreOS URL contains a specific build version.
# Update this URL periodically from:
# https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/
#
# For more info: https://github.com/ublue-os/ucore

rd.systemd.pull=raw,machine,verify=no,blockdev:rootdisk:https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/43.20250521.3.0/x86_64/fedora-coreos-43.20250521.3.0-metal.x86_64.raw.xz
root=gpt-auto
ip=dhcp
console=tty0
console=ttyS0,115200n8
systemd.log_level=info
