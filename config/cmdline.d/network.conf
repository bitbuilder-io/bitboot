# BitBoot network boot prerequisites
# Network configuration required for rd.systemd.pull functionality

# Enable DHCP on all interfaces
ip=dhcp

# Enable systemd-networkd in initramfs
rd.systemd.networkd=1

# Enable systemd-resolved for DNS
rd.systemd.resolved=1

# Wait for network to be online before proceeding
rd.net.timeout.carrier=10
rd.net.timeout.dhcp=30
