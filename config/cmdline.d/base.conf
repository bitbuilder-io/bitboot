# BitBoot base kernel command line options
# Common options for console output and logging

# Console configuration for UEFI systems
console=tty0
console=ttyS0,115200n8

# Systemd logging level
systemd.log_level=info
systemd.log_target=console

# Enable kernel messages
loglevel=4

# Enable early printk for debugging
earlyprintk=serial,ttyS0,115200
