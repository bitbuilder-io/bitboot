# BitBoot Release Workflow
# Automated release creation for tagged versions
#
# This workflow builds each distro profile as a separate job, allowing
# individual profiles to fail without blocking the release of working ones.
#
# Triggers:
# - Push of version tags (v*)
#
# Actions:
# - Builds each BitBoot UKI profile independently
# - Creates GitHub release with all successful artifacts
# - Generates release notes

name: Release BitBoot

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_DIR: build

permissions:
  contents: write

jobs:
  # Build each profile as a separate job
  build-ucore:
    name: uCore
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: ucore

  build-flatcar:
    name: Flatcar Linux
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: flatcar

  build-alpine-zfs-installer:
    name: Alpine ZFS Installer
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: alpine-zfs-installer

  build-alpine-netboot:
    name: Alpine Netboot
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: alpine-netboot

  build-nixos-kexec:
    name: NixOS Kexec
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: nixos-kexec

  build-vyos:
    name: VyOS
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: vyos

  build-bitboot:
    name: BitBoot Recovery
    uses: ./.github/workflows/build-uki.yml
    with:
      profile: bitboot

  # Build chainload profiles (ZFSBootMenu, netboot.xyz)
  build-chainload:
    name: Build Chainload Profiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:43
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y curl wget xz file

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Fetch ZFSBootMenu and netboot.xyz
        run: |
          mkdir -p ${BUILD_DIR}/efi
          ./scripts/fetch-deps.sh --skip-alpine --output ${BUILD_DIR}/deps
          cp ${BUILD_DIR}/deps/zfsbootmenu/*.efi ${BUILD_DIR}/efi/ 2>/dev/null || true
          cp ${BUILD_DIR}/deps/netboot/*.efi ${BUILD_DIR}/efi/ 2>/dev/null || true
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}

      - name: Upload chainload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uki-chainload
          path: ${{ env.BUILD_DIR }}/efi/
          if-no-files-found: warn

  # Assemble and release
  release:
    name: Create Release
    needs:
      - build-ucore
      - build-flatcar
      - build-alpine-zfs-installer
      - build-alpine-netboot
      - build-nixos-kexec
      - build-vyos
      - build-bitboot
      - build-chainload
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: registry.fedoraproject.org/fedora:43
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            make \
            parted \
            gdisk \
            dosfstools \
            e2fsprogs \
            util-linux \
            coreutils \
            findutils \
            file \
            curl \
            wget \
            xz \
            git

      - name: Get version info
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building BitBoot ${VERSION}"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Download all UKI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: uki-*
          path: ${{ env.BUILD_DIR }}/efi-artifacts/
          merge-multiple: false

      - name: Organize UKI files
        run: |
          mkdir -p ${BUILD_DIR}/efi
          find ${BUILD_DIR}/efi-artifacts -name "*.efi" -exec cp {} ${BUILD_DIR}/efi/ \;
          echo "=== Collected UKI files ==="
          ls -la ${BUILD_DIR}/efi/

      - name: Fetch Alpine dependencies for USB
        run: |
          ./scripts/fetch-deps.sh --skip-zbm --skip-netboot --output ${BUILD_DIR}/deps
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}

      - name: Create USB image
        run: |
          ./scripts/create-usb.sh --output ${BUILD_DIR}/bitboot-x86_64.img
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}

      - name: Compress USB image
        run: |
          cd ${BUILD_DIR}
          xz -9 -k bitboot-x86_64.img
          sha256sum efi/*.efi bitboot-x86_64.img bitboot-x86_64.img.xz > SHA256SUMS

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          
          # Determine which profiles were built successfully
          echo "## Build Results" > build_status.md
          echo "" >> build_status.md
          echo "| Profile | Status |" >> build_status.md
          echo "|---------|--------|" >> build_status.md
          
          for uki in ${BUILD_DIR}/efi/*.efi; do
            if [[ -f "$uki" ]]; then
              name=$(basename "$uki" .efi)
              echo "| ${name} | ✅ Built |" >> build_status.md
            fi
          done
          
          cat > release_notes.md << EOF
          # BitBoot ${VERSION}

          ## What's New
          
          This release includes the latest BitBoot multiboot USB system with support for:
          
          - **rd.systemd.pull** - Boot raw disk images directly from HTTP/HTTPS
          - **ZFSBootMenu** - ZFS boot environment management
          - **netboot.xyz** - iPXE network booting
          - **Alpine Linux ZFS Installer** - For Root-on-ZFS installations
          
          ## Included Boot Profiles
          
          $(cat build_status.md)
          
          ## Installation
          
          ### Quick Start
          
          \`\`\`bash
          # Download the compressed USB image
          wget https://github.com/${REPO}/releases/download/${VERSION}/bitboot-x86_64.img.xz
          
          # Decompress and write to USB (replace /dev/sdX with your USB device)
          xzcat bitboot-x86_64.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
          \`\`\`
          
          ### Verify Downloads
          
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`
          
          ## System Requirements
          
          - UEFI-capable system (64-bit x86_64)
          - 512MB+ USB drive
          - Network connection (for rd.systemd.pull profiles)
          - Minimum 4GB RAM recommended for network booting
          
          ## Documentation
          
          See the [README](https://github.com/${REPO}#readme) for detailed usage instructions.
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BitBoot ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            ${{ env.BUILD_DIR }}/efi/*.efi
            ${{ env.BUILD_DIR }}/bitboot-x86_64.img.xz
            ${{ env.BUILD_DIR }}/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
